[devel]
additional_packages="fish zoxide git neovim gcc-c++ java-21-openjdk lua openssl-devel rustup just"
image=fedora:latest
init=false
init_hooks="rustup-init -y"
init_hooks="mkdir -p ~/.local/bin && curl -sS https://starship.rs/install.sh | sh -s -- -b ~/.local/bin -y"
init_hooks="chsh bputh -s /bin/fish"
start_now=true
nvidia=true
volume=/home/linuxbrew/.linuxbrew/:/home/linuxbrew/.linuxbrew/

[export-zathura]
additional_packages="zathura zathura-plugins-all"
image=fedora:latest
exported_bins="/usr/bin/zathura"
