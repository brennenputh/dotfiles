add_newline = false

command_timeout = 1000

format = """
[░▒▓](#a3aed2)\
$os\
[](bg:#3557de fg:#a3aed2)\
$hostname\
${custom.distrobox}\
[](bg:#769ff0 fg:#3557de)\
$directory\
[](fg:#769ff0 bg:#394260)\
$nodejs\
$rust\
$golang\
$php\
$java\
$kotlin\
$python\
$lua\
[](fg:#394260 bg:#212736)\
$git_branch\
$git_status\
[](fg:#212736)\
\n$character"""

[hostname]
ssh_only = false
style = "bg:#3557de fg:#090c0c"
format = '[ $ssh_symbol $hostname ]($style)'
disabled = false

[os]
style = "bg:#a3aed2 fg:#090c0c"
format = "[ $symbol$type ]($style)"
disabled = false

[os.symbols]
AlmaLinux = " "
Alpine = " "
Arch = " "
Artix = " "
CentOS = " "
Debian = " "
DragonFly = " "
EndeavourOS = " "
Fedora = " "
Garuda = " "
Gentoo = " "
Kali = " "
Linux = " "
Macos = " "
Manjaro = " "
Mariner = " "
Mint = " "
NixOS = " "
OracleLinux = " "
Pop = " "
Raspbian = " "
Redhat = " "
RedHatEnterprise = " "
RockyLinux = " "
Ubuntu = " "
Void = "  "
Windows = " "

[directory]
style = "fg:#e3e5e5 bg:#769ff0"
format = "[ $path ]($style)"
truncation_length = 3 
truncate_to_repo = false
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

[git_branch]
symbol = ""
style = "bg:#212736"
format = '[[ $symbol $branch ](fg:#769ff0 $style)]($style)'

[git_status]
style = "bg:#212736"
format = '[[($all_status$ahead_behind )](fg:#769ff0 $style)]($style)'

[nodejs]
symbol = ""
style = "bg:#394260"
format = '[[ $symbol ($version) ](fg:#769ff0 $style)]($style)'

[rust]
symbol = ""
style = "bg:#394260"
format = '[[ $symbol ($version) ](fg:#769ff0 $style)]($style)'

[golang]
symbol = ""
style = "bg:#394260"
format = '[[ $symbol ($version) ](fg:#769ff0 $style)]($style)'

[php]
symbol = ""
style = "bg:#394260"
format = '[[ $symbol ($version) ](fg:#769ff0 $style)]($style)'

[java]
symbol = ""
style = "bg:#394260"
format = '[[ $symbol ($version) ](fg:#769ff0 $style)]($style)'

[kotlin]
symbol = ""
style = "bg:#394260"
format = '[[ $symbol ($version) ](fg:#769ff0 $style)]($style)'

[python]
symbol = "󰌠"
style = "bg:#394260"
format = '[[ $symbol ($version) ](fg:#769ff0 $style)]($style)'

[lua]
symbol = "󰌠"
style = "bg:#394260"
format = '[[ $symbol ($version) ](fg:#769ff0 $style)]($style)'

[custom.distrobox]
command = "echo $CONTAINER_ID"
when = ''' test "$CONTAINER_ID" != "" '''
style = "bg:#3557de fg:#090c0c"
format = '[> $output ]($style)'
